apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-echo
  labels:
    app: echo-receiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo-receiver
  template:
    metadata:
      labels:
        app: echo-receiver
    spec:
      containers:
      - name: http-echo
        image: quay.io/qiaolingtang/http-echo-receiver@sha256:ad62417d723a51bfd8f276be4dd171eee8b916aef9566938ec0b5e101059ed88
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "100m"
            memory: "128Mi"
          requests:
            cpu: "50m"
            memory: "64Mi"
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: echo-service
spec:
  selector:
    app: echo-receiver
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP